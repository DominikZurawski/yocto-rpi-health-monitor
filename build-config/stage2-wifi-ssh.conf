EXTRA_IMAGE_FEATURES:append = " ssh-server-openssh"
# Pakiety OE-Core zawierają firmware BCM43430 i BCM43455 dla Pi 3.
IMAGE_INSTALL:append = " wpa-supplicant systemd-networkd kernel-module-brcmfmac linux-firmware-bcm43430 linux-firmware-bcm43455"
# brcmfmac ładuje moduł Cypress dynamicznie podczas inicjalizacji BCM43430.
IMAGE_INSTALL:append = " kernel-module-brcmfmac-cyw wireless-regdb-static"
DISTRO_FEATURES:append = " pam"

# BCM43430 na Pi 3 Model B negocjuje WPA2 przez wpa_supplicant.
CMDLINE:append:pn-rpi-cmdline = " brcmfmac.feature_disable=0x2000"

# Użyj pobranych plików i pamięci podręcznej obrazu bazowego.
DL_DIR = "${TOPDIR}/../build-stage2/downloads"
SSTATE_DIR = "${TOPDIR}/../build-stage2/sstate-cache"

INHERIT += "extrausers stage2-wifi-ssh"
EXTRA_USERS_PARAMS = "useradd -m -p '*' -s /bin/sh -G systemd-journal developer;"
